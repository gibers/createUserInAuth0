
services:

  test:
    build:
      context: ..
      dockerfile: createUserInAuth0/Dockerfile
      target: test
    env_file:
      - ${FILE_ENV_FOR_APPLICATION}
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    depends_on:
      postgresql:
        condition: service_healthy

  createuser:
    build:
      context: ..
      dockerfile: createUserInAuth0/Dockerfile
    mem_limit: 512m
    env_file:
      - ${FILE_ENV_FOR_APPLICATION}
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    ports:
      - ${SERVEUR_PORT}:${SERVEUR_PORT}
    depends_on:
      postgresql:
        condition: service_healthy

  frontend:
    build:
      context: ../../../../Angular/MonSite/restaurant_checker_front
      dockerfile: Dockerfile
      args:
        - BACKEND_PORT=${SERVEUR_PORT}
    container_name: restaurant_checker_front
    ports:
      - "4040:80"
    depends_on:
      - createuser

  postgresql:
    container_name: createUserInAuth0-db
    image: postgres:15.13
    mem_limit: 512m
    # this mapping can be removed in production. For now, we keep it to access the DB from the IDE.  logger:
    #    image: alpine
    #    command:
    #      - /bin/sh
    #      - -c
    #      - "echo Valeur de DOMAIN_NAME : ${OKTA_OAUTH2_AUDIENCE} && sleep infinity"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=createUserInAuth0
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pwd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d createUserInAuth0"]
      interval: 5s
      timeout: 2s
      retries: 60
    volumes:
      - postgres_data:/var/lib/postgresql/data



volumes:
  postgres_data:
